<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brewline: Coffee Gear Store</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap">
<style>
:root{--bg:#FAFAF7;--card:#fff;--ink:#1d2421;--mute:#667069;--line:#dfe2db;--brand:#1F3A34;--onbrand:#fff;--brass:#B8893B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141916;--card:#1d2420;--ink:#eef1ec;--mute:#9aa49d;--line:#2d3731;--brand:#8fc2b0;--onbrand:#10201a;--brass:#d6a959}}
:root[data-theme="dark"]{--bg:#141916;--card:#1d2420;--ink:#eef1ec;--mute:#9aa49d;--line:#2d3731;--brand:#8fc2b0;--onbrand:#10201a;--brass:#d6a959}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,.logo{font-family:'Libre Baskerville',Georgia,serif;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-size:22px;font-weight:700;color:var(--brand);margin-right:auto}
.search{flex:1 1 220px;max-width:360px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.btn{background:var(--brand);color:var(--onbrand);border:0;border-radius:6px;padding:9px 14px;font-weight:600}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.hero{max-width:1100px;margin:auto;padding:36px 16px 12px}
.hero h1{font-size:clamp(26px,5vw,40px);line-height:1.2;max-width:18em}
.hero p{color:var(--mute);max-width:36em;margin:10px 0 0}
.tools{max-width:1100px;margin:auto;padding:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
select{margin-left:auto;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.grid{max-width:1100px;margin:auto;padding:0 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:160px;display:grid;place-items:center}.pic svg{width:130px;height:130px}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h2{font-size:16px}.cat{color:var(--mute);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px}
.price{font-weight:700}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}
.scrim.on{display:block}
aside{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--bg);z-index:11;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
aside.on{transform:none}
.ahead,.afoot{padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.ahead{border-bottom:1px solid var(--line)}.afoot{border-top:1px solid var(--line);flex-direction:column;align-items:stretch;gap:8px}
.items{flex:1;overflow:auto;padding:8px 16px}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item .t{width:44px;height:44px}.item .t svg{width:100%;height:100%}
.qty{display:flex;align-items:center;gap:6px;margin-top:4px}
.qty button{width:26px;height:26px;border:1px solid var(--line);background:var(--card);border-radius:4px}
.rm{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:13px}
.ship{font-size:13px;color:var(--mute)}
.bar2{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--brass)}
.sum{display:flex;justify-content:space-between}
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:12;padding:16px}
.modal.on{display:grid}
.pic{cursor:pointer}.lnk{background:none;border:0;padding:0;font:inherit;font-weight:700;text-align:left}.lnk:hover{text-decoration:underline}.dpic{height:200px;display:grid;place-items:center;border-radius:8px}.dpic svg{width:170px;height:170px}.stars{color:var(--brass);letter-spacing:1px}.box h3{font-size:15px;margin:14px 0 4px}.box ul,.box ol{margin:0;padding-left:18px;color:var(--mute)}.acts{display:flex;gap:8px;margin-top:16px}.rel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.mini{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px}.mini .mp{display:grid;place-items:center;height:72px;border-radius:6px}.mini svg{width:56px;height:56px}.box{background:var(--bg);border-radius:10px;padding:20px;width:min(520px,100%);max-height:100%;overflow:auto}
.box label{display:block;margin:10px 0 4px;font-size:14px}
.box input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.err{color:#b3261e;font-size:13px;min-height:18px}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<header><div class="bar">
<span class="logo">Brewline</span>
<input class="search" id="q" type="search" placeholder="Search coffee gear" aria-label="Search products">
<button class="btn ghost" id="theme" aria-label="Toggle dark mode">Theme</button>
<button class="btn" id="open">Cart (<span id="count">0</span>)</button>
</div></header>
<section class="hero">
<h1>Everything you need for a better cup at home</h1>
<p>Grinders, brewers, kettles and beans, picked for people who brew every day. Free shipping on orders over ₹2,999.</p>
</section>
<div class="tools" id="chips" role="group" aria-label="Filter by category"></div>
<main class="grid" id="grid"></main>

<div class="scrim" id="scrim"></div>
<aside id="cart" aria-label="Shopping cart" aria-hidden="true">
<div class="ahead"><h2>Your cart</h2><button class="btn ghost" id="close">Close</button></div>
<div class="items" id="items"></div>
<div class="afoot">
<div class="ship" id="shipmsg"></div><div class="bar2"><i id="shipbar"></i></div>
<div class="sum"><span>Subtotal</span><strong id="sub">₹0</strong></div>
<button class="btn" id="checkout">Check out</button>
</div>
</aside>

<div class="modal" id="modal"><div class="box" id="box"></div></div>

const cats=["All",...new Set(P.map(p=>p.c))];
$("#chips").innerHTML=cats.map(c=>`<button class="chip" data-c="${c}" aria-pressed="${c==="All"}">${c}</button>`).join("")+
`<select id="sort" aria-label="Sort products"><option value="featured">Featured</option><option value="low">Price, low to high</option><option value="high">Price, high to low</option><option value="rating">Top rated</option></select>`;
function list(){
 let r=P.filter(p=>(cat==="All"||p.c===cat)&&p.n.toLowerCase().includes(q.toLowerCase()));
 if(sort==="low")r.sort((a,b)=>a.p-b.p);if(sort==="high")r.sort((a,b)=>b.p-a.p);if(sort==="rating")r.sort((a,b)=>b.r-a.r);
 $("#grid").innerHTML=r.length?r.map(p=>`<article class="card"><div class="pic" data-o="${p.id}" style="background:${p.bg}">${IMG[p.id]}</div><div class="info"><h2><button class="lnk" data-o="${p.id}">${p.n}</button></h2><span class="cat">${p.c}, rated ${p.r}</span><div class="row"><span class="price">${money(p.p)}</span><button class="btn" data-add="${p.id}">Add to cart</button></div></div></article>`).join(""):`<p class="empty">No products match your search. Try another word or category.</p>`;
}
function draw(){
 const ids=Object.keys(cart).filter(i=>cart[i]>0),n=ids.reduce((s,i)=>s+cart[i],0);
 const sub=ids.reduce((s,i)=>s+cart[i]*P.find(p=>p.id==i).p,0);
 $("#count").textContent=n;$("#sub").textContent=money(sub);
 $("#items").innerHTML=ids.length?ids.map(i=>{const p=P.find(x=>x.id==i);return `<div class="item"><div class="t">${IMG[p.id]}</div><div><strong>${p.n}</strong><div class="qty"><button data-d="${i}" aria-label="Decrease quantity">-</button><span>${cart[i]}</span><button data-u="${i}" aria-label="Increase quantity">+</button></div></div><div style="text-align:right">${money(p.p*cart[i])}<br><button class="rm" data-r="${i}">Remove</button></div></div>`}).join(""):`<p class="empty">Your cart is empty. Add something from the store.</p>`;
 $("#shipmsg").textContent=sub>=FREE?"You get free shipping.":`Add ${money(FREE-sub)} more for free shipping.`;
 $("#shipbar").style.width=Math.min(100,sub/FREE*100)+"%";
 $("#checkout").disabled=!ids.length;save();
}
const panel=on=>{$("#cart").classList.toggle("on",on);$("#scrim").classList.toggle("on",on);$("#cart").setAttribute("aria-hidden",!on)};
const close=()=>{panel(false);$("#modal").classList.remove("on")};
document.addEventListener("click",e=>{
 const t=e.target,g=a=>t.dataset[a],o=t.closest("[data-o]");
 if(o){detail(o.dataset.o)}
 else if(t.id==="modal")close();
 else if(g("add")){cart[g("add")]=(cart[g("add")]||0)+1;draw();$("#modal").classList.remove("on");panel(true)}
 else if(g("u")){cart[g("u")]++;draw()}
 else if(g("d")){cart[g("d")]--;if(cart[g("d")]<1)delete cart[g("d")];draw()}
 else if(g("r")){delete cart[g("r")];draw()}
 else if(g("c")){cat=g("c");document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===cat));list()}
 else if(t.id==="open")panel(true);
 else if(t.id==="close"||t.id==="scrim")close();
 else if(t.id==="theme"){const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue("--bg").trim()==="#141916";d.dataset.theme=dark?"light":"dark"}
 else if(t.id==="checkout"){
  const sub=Object.keys(cart).reduce((s,i)=>s+cart[i]*P.find(p=>p.id==i).p,0),ship=sub>=FREE?0:99;
  $("#box").innerHTML=`<h2>Checkout</h2><p class="ship">Subtotal ${money(sub)} + shipping ${money(ship)} = <strong>${money(sub+ship)}</strong></p><label for="nm">Full name</label><input id="nm" autocomplete="name"><label for="em">Email</label><input id="em" type="email" autocomplete="email"><label for="ad">Delivery address</label><input id="ad" autocomplete="street-address"><div class="err" id="err" role="alert"></div><button class="btn" id="pay" style="width:100%">Place order</button><button class="rm" id="cancel" style="margin-top:8px">Back to cart</button>`;
  $("#modal").classList.add("on")}
 else if(t.id==="cancel")$("#modal").classList.remove("on");
 else if(t.id==="pay"){
  const v=i=>$("#"+i).value.trim();
  if(!v("nm")||!/^\S+@\S+\.\S+$/.test(v("em"))||!v("ad")){$("#err").textContent="Enter your name, a valid email and a delivery address.";return}
  const no="BL-"+Math.floor(10000+Math.random()*90000);cart={};draw();
  $("#box").innerHTML=`<h2>Order placed</h2><p>Thanks, ${v("nm")}. Your order <strong>${no}</strong> is confirmed. A receipt goes to ${v("em")}.</p><button class="btn" id="done">Keep shopping</button>`}
 else if(t.id==="done")close();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
$("#q").addEventListener("input",e=>{q=e.target.value;list()});
document.addEventListener("change",e=>{if(e.target.id==="sort"){sort=e.target.value;list()}});
list();draw();
</script>
</body>
</html>
